<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <title>DOCTOR WORKSPACE - مساحة عمل الدكتور</title>
    <meta name="description" content="منصة داخلية متكاملة لشركة الدكتور تجمع المحادثات الفورية وإدارة المهام واعتمادها والحضور والانصراف والإجازات والاجتماعات." />
    <meta property="og:title" content="DOCTOR WORKSPACE - مساحة عمل الدكتور" />
    <meta property="og:description" content="منصة داخلية متكاملة لشركة الدكتور تجمع المحادثات الفورية وإدارة المهام واعتمادها والحضور والانصراف والإجازات والاجتماعات." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Doctor Workspace" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8fafc] text-slate-900 font-['Inter','Cairo',sans-serif] antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <div id="root"></div>

    <!-- Fallback if opened directly via file:// in browser without a web server -->
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.children.length === 0) {
              root.innerHTML = '<div style="min-height:100vh;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Cairo,sans-serif;padding:20px;text-align:center;direction:rtl;">' +
                '<div style="background:#1e293b;border:1px solid #334155;border-radius:24px;padding:32px;max-width:500px;width:100%;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
                '<div style="width:70px;height:70px;margin:0 auto 16px;"><img src="./logo.svg" style="width:100%;height:100%;object-fit:contain;" alt="Logo" /></div>' +
                '<h2 style="font-size:20px;font-weight:bold;margin-bottom:12px;color:#34d399;">مساحة عمل الدكتور (DOCTOR WORKSPACE)</h2>' +
                '<p style="font-size:14px;color:#94a3b8;line-height:1.7;margin-bottom:20px;">' +
                'تم فتح الملف مباشرة كملف محلي (file://) والمتصفحات الحديثة (مثل Google Chrome) تحظر تشغيل تطبيقات React الحديثة مباشرة بالنقر المزدوج لأسباب أمنية (CORS / ES Modules).' +
                '</p>' +
                '<div style="background:#0f172a;padding:16px;border-radius:12px;margin-bottom:20px;text-align:right;font-size:13px;color:#cbd5e1;line-height:1.8;">' +
                '💡 <b>طرق التشغيل المتاحة:</b><br/>' +
                '1. <b>فتح الرابط المباشر للموقع أونلاين:</b> استخدم الرابط السحابي المرفق.<br/>' +
                '2. <b>تشغيل محلي:</b> عبر سطر الأوامر بكتابة <code>npm install</code> ثم <code>npm run dev</code>.' +
                '</div>' +
                '</div></div>';
            }
          }, 800);
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
